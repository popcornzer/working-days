<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ผู้ดูแล - จัดการวันหยุด</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7280;--ac:#2563eb;--bd:#e3e6ea;--hol:#fee2e2}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--tx:#e8eaee;--mut:#9aa3b2;--ac:#6ea0ff;--bd:#2c3340;--hol:#4d1d1d}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:1.3rem;margin:8px 0 16px}.adm{font-size:.85rem;color:var(--ac);text-decoration:none;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:480px){.row{grid-template-columns:1fr}}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
button.sec{background:var(--bd);color:var(--tx)}button.del{background:#dc2626}
.big{width:100%;margin-top:12px}.btns{display:flex;gap:8px;flex-wrap:wrap}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--hol);margin-bottom:6px;font-size:.9rem}
li div:last-child{display:flex;gap:6px}li button{padding:5px 10px;font-size:.8rem}
.err{color:#dc2626;margin-top:6px}
</style>
</head>
<body>
<main>
<div class="top"><h1>🔒 จัดการวันหยุดพิเศษ</h1><a class="adm" href="/">← กลับหน้าคำนวณ</a></div>

<div class="card" id="login">
  <label for="pw">รหัสผู้ดูแล</label>
  <input type="password" id="pw" autocomplete="current-password">
  <button class="big" id="loginBtn" type="button">เข้าสู่ระบบ</button>
</div>

<div id="panel" hidden>
  <div class="card">
    <div class="row">
      <div><label for="d">วันที่</label><input type="date" id="d"></div>
      <div><label for="n">ชื่อวันหยุด (ไม่บังคับ)</label><input type="text" id="n"></div>
    </div>
    <div class="btns">
      <button id="save" type="button">เพิ่มวันหยุด</button>
      <button id="cancel" class="sec" type="button" hidden>ยกเลิกการแก้ไข</button>
      <button id="logout" class="sec" type="button">ออกจากระบบ</button>
    </div>
  </div>
  <div class="card"><label>รายการวันหยุดทั้งหมด</label><ul id="list"></ul></div>
</div>
<div class="err" id="err"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const TH = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
let pw = sessionStorage.getItem("pw") || "";  // เก็บรหัสไว้ชั่วคราวจนปิดแท็บ
let editing = null;                           // วันที่เดิมของรายการที่กำลังแก้ไข
const setErr = m => { $("err").textContent = m; };

// เรียก API พร้อมแนบรหัสผู้ดูแล
async function api(method, body){
  const r = await fetch("/api/holidays", {method, headers:{"Content-Type":"application/json","x-admin-password":pw}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "เกิดข้อผิดพลาด");
  return j;
}
function show(on){ $("login").hidden = on; $("panel").hidden = !on; }

async function login(){
  try {
    await api("POST", {action:"verify"});
    sessionStorage.setItem("pw", pw); setErr(""); show(true); await load();
  } catch(e){ pw = ""; sessionStorage.removeItem("pw"); show(false); setErr(e.message); }
}

async function load(){
  const rows = await api("GET");
  const ul = $("list"); ul.innerHTML = "";
  if (!rows.length) ul.textContent = "ยังไม่มีวันหยุดพิเศษ";
  rows.forEach(({date, name}) => {
    const li = document.createElement("li");
    const info = document.createElement("div");
    const [y,m,d] = date.split("-").map(Number);
    info.textContent = `${date} (${TH[new Date(Date.UTC(y,m-1,d)).getUTCDay()]}) ${name}`;
    const btns = document.createElement("div");
    const eb = document.createElement("button"); eb.textContent = "แก้ไข"; eb.className = "sec";
    eb.onclick = () => startEdit(date, name);
    const db = document.createElement("button"); db.textContent = "ลบ"; db.className = "del";
    db.onclick = async () => {
      if (!confirm(`ลบวันหยุด ${date} ใช่หรือไม่`)) return;
      try { await api("DELETE", {date}); setErr(""); await load(); } catch(e){ setErr(e.message); }
    };
    btns.append(eb, db); li.append(info, btns); ul.appendChild(li);
  });
}

function startEdit(date, name){
  editing = date; $("d").value = date; $("n").value = name;
  $("save").textContent = "บันทึกการแก้ไข"; $("cancel").hidden = false;
  window.scrollTo({top:0, behavior:"smooth"});
}
function resetForm(){
  editing = null; $("d").value = ""; $("n").value = "";
  $("save").textContent = "เพิ่มวันหยุด"; $("cancel").hidden = true;
}

$("loginBtn").onclick = () => { pw = $("pw").value; login(); };
$("pw").onkeydown = e => { if (e.key === "Enter") $("loginBtn").click(); };
$("cancel").onclick = resetForm;
$("logout").onclick = () => { pw = ""; sessionStorage.removeItem("pw"); resetForm(); $("pw").value = ""; show(false); };
$("save").onclick = async () => {
  if (!$("d").value) return setErr("กรุณาเลือกวันที่");
  try {
    await api("POST", {date:$("d").value, name:$("n").value, oldDate:editing});
    setErr(""); resetForm(); await load();
  } catch(e){ setErr(e.message); }
};

if (pw) login();   // ถ้าเคยเข้าสู่ระบบในแท็บนี้แล้ว เข้าต่อให้อัตโนมัติ
</script>
</body>
</html>
